# Arranque con un solo comando:   docker compose up --build
# Tienda: http://localhost:8000/tienda/   ·   API: http://localhost:8000/docs
# Parar y eliminar:               docker compose down
# Las variables se pueden definir en un fichero .env (ver .env.example).
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: ${DOCKERHUB_USER:-local}/tienda-online-api:${APP_VERSION:-1.0.0}
    container_name: tienda-online-api
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CARGAR_DATOS_EJEMPLO: ${CARGAR_DATOS_EJEMPLO:-true}
    # Endurecimiento del contenedor
    read_only: true                  # sistema de ficheros de solo lectura
    tmpfs:
      - /tmp
    cap_drop:
      - ALL                          # sin capacidades privilegiadas de Linux
    security_opt:
      - no-new-privileges:true       # impide escalar privilegios
    restart: unless-stopped
